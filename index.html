    if(filter!=='todas' && x.estado!==filter) return false;

function makeThumb(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file); var im = new Image();
    im.onload = function(){
      var W = 720, srcH = Math.min(im.height, im.width * 0.75);
      var c = document.createElement('canvas'); c.width = W; c.height = Math.round(W * srcH / im.width);
      c.getContext('2d').drawImage(im, 0, 0, im.width, srcH, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(function(b){ b ? res(b) : rej(new Error('miniatura')); }, 'image/jpeg', 0.85);
    };
    im.onerror = function(){ rej(new Error('No se pudo leer la imagen')); };
    im.src = url;
  });
}
$('f_save').onclick = async function(){
  var num = $('f_num').value.trim().replace(/^#/,'');
  if(!num){ setStatus('Pon el número de cuenta.'); return; }
  var file = $('f_img').files[0];
  if(editing==null && !file){ setStatus('Elige la imagen del catálogo.'); return; }
  if(file && file.size > 20*1024*1024){ setStatus('La imagen pesa más de 20 MB. Usa la versión Cuenta_N.jpg (no la HD).'); return; }
  var next = clone();
  var item = editing!=null ? next.cuentas[editing] : {};
  if(editing==null){
    var dup = next.cuentas.some(function(x){return String(x.num)===num});
    if(dup){ setStatus('Ya existe la Cuenta #' + num + '. Usa Editar.'); return; }
  }
  $('f_save').disabled = true;
  try{
    if(file){
      setStatus('Subiendo imagen…');
      var up = await assets.upload(file);
      var tb = await makeThumb(file);
      var upt = await assets.upload(tb);
      item.img = up.url; item.thumb = upt.url;
    }
    item.num = num; item.skins = $('f_skins').value.trim(); item.legend = $('f_legend').value.trim();
    item.precio = $('f_precio').value.trim(); item.estado = $('f_estado').value; item.desc = $('f_desc').value.trim();
    if(editing==null){ item.fecha = new Date().toISOString().slice(0,10); next.cuentas.push(item); }
    await save(next, 'Cuenta publicada');
  }catch(err){ setStatus('Error: ' + (err && (err.message||err.code) || err)); }
  $('f_save').disabled = false;
};
