var rkOpen = false;
function rlabel(r){ return r==='Mega'?'Mega Coleccionista':'Coleccionista '+r; }
function rimg(r,cl){ return RIMG[r] ? '<img class="'+(cl||'remb')+'" src="'+RIMG[r]+'" alt="">' : '<span class="'+(cl||'remb')+' rall">🏆</span>'; }
function tier(x){ var r = String(x.rango||''); for(var k=0;k<RANKS.length;k++) if(r.indexOf(RANKS[k])===0) return RANKS[k]; return ''; }
function rankName(x){ var r = String(x.rango||''); if(!r) return ''; return r.indexOf('Mega')===0 ? 'Mega Coleccionista'+r.slice(4) : 'Coleccionista '+r; }
var skinNums = null;
window.__cuentasNums = function(){ return STATE.cuentas.filter(function(c){return c.estado!=='vendida'}).map(function(c){return String(c.num)}); };
window.__setSkinFilter = function(n){ skinNums = n; render(); };
window.__openCuenta = function(num){ for(var k=0;k<STATE.cuentas.length;k++){ if(String(STATE.cuentas[k].num)===String(num)){ openModal(k); return; } } };
var LABEL = {disponible:'DISPONIBLE', reservada:'RESERVADA', vendida:'VENDIDA'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function waLink(n){return 'https://wa.me/' + WA + '?text=' + encodeURIComponent('Hola Johnny, me interesa la Cuenta #' + n + ' que vi en tu página.')}
function sorted(){
  var order = {disponible:0, reservada:1, vendida:2};
  return STATE.cuentas.slice().sort(function(a,b){return (order[a.estado]-order[b.estado]) || (Number(a.num)-Number(b.num))});
}
function renderTabs(){
  var c = {todas:STATE.cuentas.length, disponible:0, reservada:0, vendida:0};
  STATE.cuentas.forEach(function(x){c[x.estado]++});
  var t = [['disponible','Disponibles'],['reservada','Reservadas'],['vendida','Vendidas'],['todas','Todas']];
  $('tabs').innerHTML = t.map(function(p){return '<button class="tab'+(filter===p[0]?' on':'')+'" data-f="'+p[0]+'">'+p[1]+' ('+c[p[0]]+')</button>'}).join('');
  var rc = {}, base = STATE.cuentas.filter(function(x){ return filter==='todas' || x.estado===filter; });
  base.forEach(function(x){ var t = tier(x); if(t) rc[t] = (rc[t]||0)+1; });
  if(rank && !rc[rank]) rank = '';
  var opts = [['', 'Todos los rangos', base.length]].concat(RANKS.filter(function(r){return rc[r]}).map(function(r){ return [r, rlabel(r), rc[r]]; }));
  var cur = opts.filter(function(o){return o[0]===rank})[0] || opts[0];
  $('ranks').innerHTML = '<span class="rlab">Rango de colección:</span><div class="rdd'+(rkOpen?' open':'')+'"><button class="rbtn" id="rbtn">'+rimg(cur[0])+'<span>'+cur[1]+'</span><b>'+cur[2]+'</b><i class="rcar">▾</i></button>'
    + '<div class="rmenu">' + opts.map(function(o){ return '<button class="ropt'+(o[0]===rank?' on':'')+'" data-rk="'+o[0]+'">'+rimg(o[0])+'<span>'+o[1]+'</span><b>'+o[2]+'</b></button>'; }).join('') + '</div></div>';
}
function render(){
  renderTabs();
  var q = query.trim().toLowerCase();
  var list = sorted().filter(function(x){
    if(filter!=='todas' && x.estado!==filter) return false;
    if(skinNums && skinNums.indexOf(String(x.num))<0) return false;
    if(rank && tier(x)!==rank) return false;
    if(!q) return true;
    return (('cuenta #'+x.num+' '+(x.desc||'')+' '+rankName(x)).toLowerCase().indexOf(q) >= 0);
  });
  if(!list.length){ $('grid').innerHTML = '<div class="empty">'+(STATE.cuentas.length?'No hay cuentas con ese filtro.':'Todavía no hay cuentas publicadas.')+'</div>'; return; }
  $('grid').innerHTML = list.map(function(x){
    var i = STATE.cuentas.indexOf(x);
    var meta = '';
    if(x.skins) meta += '<span class="chip">'+esc(x.skins)+' skins</span>';
    if(x.legend) meta += '<span class="chip">'+esc(x.legend)+' Legend</span>';
    if(x.rango) meta += '<span class="chip rchip rk-'+tier(x).toLowerCase()+'">'+rimg(tier(x),'rmini')+esc(rankName(x))+'</span>';
    var price = x.precio ? '<div class="price">'+esc(x.precio)+'</div>' : '<div class="price ask">Precio a consultar</div>';
    var adm = (artifact && assets) ? '<div class="admrow"><select data-st="'+i+'">'+['disponible','reservada','vendida'].map(function(s){return '<option value="'+s+'"'+(x.estado===s?' selected':'')+'>'+LABEL[s]+'</option>'}).join('')+'</select><button data-ed="'+i+'">Editar</button><button data-del="'+i+'">Eliminar</button></div>' : '';
    return '<article class="card'+(x.estado==='vendida'?' sold':'')+'"><div class="thumb" data-open="'+i+'"><img loading="lazy" src="'+esc(x.thumb||x.img)+'" alt="Cuenta #'+esc(x.num)+'"><span class="badge b-'+x.estado+'">'+LABEL[x.estado]+'</span></div>'
      + '<div class="body"><div class="num">CUENTA #'+esc(x.num)+'</div><div class="meta">'+meta+'</div>'+price
      + (x.desc ? '<p class="desc" id="d'+i+'">'+esc(x.desc)+'</p><button class="more" data-more="'+i+'">Ver más</button>' : '')
      + '<div class="actions"><button class="btn btn-gold" data-open="'+i+'">Ver catálogo</button>'
      + (x.estado!=='vendida' ? '<a class="btn btn-wa" href="'+waLink(x.num)+'" target="_blank" rel="noopener">WhatsApp</a>' : '')
      + '</div>'+adm+'</div></article>';
  }).join('');
}

// ---------- comparación de imágenes ----------
var FW = 12, FH = 18;
var c1 = document.createElement('canvas'); c1.width = 48; c1.height = 72; var x1 = c1.getContext('2d', {willReadFrequently:true});
var c2 = document.createElement('canvas'); c2.width = FW; c2.height = FH; var x2 = c2.getContext('2d', {willReadFrequently:true});
x1.imageSmoothingQuality = 'high'; x2.imageSmoothingQuality = 'high';
function feat(src, sx, sy, sw, sh){
  // zona del arte de la tarjeta (sin el nombre de abajo ni el marco)
  var ax = sx + sw*0.06, ay = sy + sh*0.05, aw = sw*0.88, ah = sh*0.65;
  x1.drawImage(src, ax, ay, aw, ah, 0, 0, 48, 72);
  x2.drawImage(c1, 0, 0, 48, 72, 0, 0, FW, FH);
  var d = x2.getImageData(0, 0, FW, FH).data, n = FW*FH, g = new Float32Array(n), m = 0, s = 0, k;
  for(k=0;k<n;k++){ g[k] = 0.299*d[k*4] + 0.587*d[k*4+1] + 0.114*d[k*4+2]; m += g[k]; }
  m /= n; for(k=0;k<n;k++){ s += (g[k]-m)*(g[k]-m); } s = Math.sqrt(s/n) + 1e-3;
  for(k=0;k<n;k++) g[k] = (g[k]-m)/s;
  var col = new Float32Array(4*6*3);
  for(var by=0;by<6;by++) for(var bx=0;bx<4;bx++) for(var ch=0;ch<3;ch++){
    var t = 0; for(var yy=0;yy<3;yy++) for(var xx=0;xx<3;xx++) t += d[((by*3+yy)*FW + bx*3+xx)*4+ch];
    col[(by*4+bx)*3+ch] = t/9/255;
  }
  return {g:g, c:col};
}
function dist(a, b){
  var e = 0, k, n = a.g.length; for(k=0;k<n;k++){ var q = a.g[k]-b.g[k]; e += q*q; }
  var f = 0, m = a.c.length; for(k=0;k<m;k++){ var r = a.c[k]-b.c[k]; f += r*r; }
  return e/n + 3*f/m;
}
function loadFeats(){
  if(loading) return loading;
  loading = new Promise(function(res, rej){
    var im = new Image();
    im.onload = function(){
      var tw = im.naturalWidth / DB.cols, th = im.naturalHeight / ROWS;
      feats = DB.s.map(function(s, i){ return feat(im, (i%DB.cols)*tw, Math.floor(i/DB.cols)*th, tw, th); });
      res(feats);
    };
    im.onerror = function(){ loading = null; rej(new Error('No se pudo cargar la galería de skins')); };
    im.src = DB.sprite + '?v=' + DB.v;
  });
  return loading;
}
function windows(W, H){
  var out = [[0,0,W,H]], R = DB.th / DB.tw;
  // la imagen entera como si fuera solo el arte
  var aw = Math.min(W, H*0.88/0.65/R), ah = aw*R*0.65/0.88;
  out.push([(W-aw)/2 - aw*0.06/0.88, (H-ah)/2 - ah*0.05/0.65, aw/0.88, ah/0.65]);
  var base = Math.min(W, H/R);
  [1, 0.8, 0.62, 0.48, 0.37, 0.28, 0.21].forEach(function(sc){
    var w = base*sc, h = w*R, st = Math.max(4, w*0.17);
    for(var y=0; y+h<=H+1; y+=st) for(var x=0; x+w<=W+1; x+=st) out.push([x,y,w,h]);
  });
  return out;
}
function search(file){
  $('sres').innerHTML = '<p class="shint">⏳ Buscando…</p>';
  var url = URL.createObjectURL(file), im = new Image();
  im.onload = function(){
    var sc = Math.min(1, 900/Math.max(im.width, im.height));
    var cv = document.createElement('canvas'); cv.width = Math.round(im.width*sc); cv.height = Math.round(im.height*sc);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    $('sprev').innerHTML = '<img src="'+url+'" alt="tu captura"><button class="btn btn-ghost" id="sagain">Elegir otra imagen</button>';
    $('sagain').onclick = function(){ $('sfile').click(); };
    loadFeats().then(function(F){
      setTimeout(function(){
        var ws = windows(cv.width, cv.height), best = new Float32Array(F.length).fill(99);
        ws.forEach(function(w){
          var q = feat(cv, w[0], w[1], w[2], w[3]);
          for(var i=0;i<F.length;i++){ var d = dist(q, F[i]), j = DB.s[i].length>2 ? DB.s[i][2] : i; if(d < best[j]) best[j] = d; }
        });
        var idx = []; for(var i=0;i<F.length;i++) if(DB.s[i].length<3 && accs(i).length) idx.push(i);
        idx.sort(function(a,b){return best[a]-best[b]});
        var top = idx.slice(0, 12);
        var head = best[top[0]] < 0.75 ? '<p class="shint ok">✅ Encontré esta skin. Tócala para ver las cuentas que la tienen.</p>'
                 : '<p class="shint">No encontré una igualita. Estas son las más parecidas; si no está, búscala en la <a href="#" id="togal">Galería de skins</a>.</p>';
        $('sres').innerHTML = head + '<div class="sgrid">' + top.map(function(i, k){
          return tile(i, (k===0 && best[i] < 0.75) ? '<span class="sbest">★ Más parecida</span>' : '');
        }).join('') + '</div>';
        var tg = $('togal'); if(tg) tg.onclick = function(e){ e.preventDefault(); showTab('gal'); };
      }, 30);
    }).catch(function(err){ $('sres').innerHTML = '<p class="shint">'+err.message+'</p>'; });
  };
  im.onerror = function(){ $('sres').innerHTML = '<p class="shint">No se pudo leer esa imagen. Prueba con una captura en JPG o PNG.</p>'; };
  im.src = url;
}
$('sfile').addEventListener('change', function(e){ var f = e.target.files[0]; if(f) search(f); e.target.value = ''; });

['dragover','dragenter'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); }); });

});

  });
}
var HTML = '<div class="gal" id="gal"><div class="ghead"><button class="home" id="gclose" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3z"/></svg><span>Inicio</span></button>'
 + '<div class="gtit"><b>GALERÍA DE SKINS</b><small id="gsub"></small></div>'
 + '<input class="search gq" id="gq" placeholder="Busca tu skin o héroe (ej. Gojo, Kagura)"></div>'
 + '<div class="gbody"><aside class="glist" id="glist"></aside><section class="gmain" id="gmain"></section></div></div>'
 + '<div class="modal" id="gdet"><div class="gdbox" id="gdbox"></div></div>';
var h = document.createElement('div'); h.innerHTML = HTML; document.body.appendChild(h);
var bar = document.querySelector('.bar');
if(bar){ var b = document.createElement('button'); b.className = 'btn btn-gal'; b.id = 'opengal'; b.innerHTML = '🎴 Galería de skins'; bar.insertBefore(b, bar.querySelector('#imgsearch')); }

function item(key, label, n, rep){
  return '<button class="gitem'+(sel===key?' on':'')+'" data-ser="'+esc(key)+'">'
   + (rep!=null ? '<span class="glogo" style="'+badgeBg(rep)+'"></span>' : '<span class="glogo all">★</span>')
   + '<span class="gname">'+esc(label)+'</span><span class="gn">'+n+'</span></button>';
}
function renderList(){
  var tot = 0; Object.keys(BYS).forEach(function(k){ tot += BYS[k].length; });
  var out = item('', 'Todas', tot, null);
  GROUPS.forEach(function(g){
    var ks = g[1].filter(function(k){ return BYS[k]; });
    if(!ks.length) return;
    out += '<div class="ggrp">'+g[0]+'</div>';
    ks.forEach(function(k){ out += item(k, k, BYS[k].length, REP[k]); });
  });
  $('glist').innerHTML = out;
  $('gsub').textContent = tot + ' skins a la venta · ' + Object.keys(BYS).length + ' series';
}
function card(i){
  var n = DB.n[i], a = accs(i);
  return '<button class="gcard" data-sk="'+i+'"><span class="gimg" style="'+tileBg(i)+'"></span>'
   + '<span class="gcn">'+esc(n[0])+'</span><span class="gch">'+esc(n[1])+'</span>'
   + '<span class="gacc">🟢 '+a.length+' cuenta'+(a.length===1?'':'s')+'</span></button>';
}
function renderMain(){
  var nq = norm(q.trim()), ids = [], head = '';
  if(nq){
    DB.n.forEach(function(n,i){ if(n && DB.s[i].length<3 && accs(i).length && (norm(n[0]+' '+n[1]+' '+n[2]).indexOf(nq)>=0)) ids.push(i); });
    head = '<div class="gban plain"><div class="gbt"><b>Resultados para “'+esc(q.trim())+'”</b><small>'+ids.length+' skins encontradas</small></div></div>';
  } else if(sel){
    ids = BYS[sel] || [];
    var bi = BAN[sel];
    head = bi!=null
      ? '<div class="gban" style="background-image:url(series.jpg?v='+DB.v+');background-size:100% auto;background-position:0 '+(bi/(Object.keys(BAN).length-1)*100)+'%"><div class="gbt"><b>'+esc(sel)+'</b><small>'+ids.length+' skins a la venta</small></div></div>'
      : '<div class="gban plain"><span class="glogo big" style="'+badgeBg(REP[sel])+'"></span><div class="gbt"><b>'+esc(sel)+'</b><small>'+ids.length+' skins a la venta</small></div></div>';
  } else {
    GROUPS.forEach(function(g){ g[1].forEach(function(k){ if(BYS[k]) ids = ids.concat(BYS[k]); }); });
    head = '<div class="gban plain"><div class="gbt"><b>Todas las skins a la venta</b><small>Elige una serie o escribe el nombre de tu skin</small></div></div>';
  }
  $('gmain').innerHTML = head + (ids.length ? '<div class="ggrid">'+ids.map(card).join('')+'</div>' : '<p class="gempty">No encontré esa skin en las cuentas a la venta. Escríbeme por WhatsApp y te aviso cuando llegue una. <a href="https://wa.me/'+WA+'?text='+encodeURIComponent('Hola Johnny, busco una cuenta con la skin: '+q)+'" target="_blank" rel="noopener">Preguntar por WhatsApp</a></p>');
  $('gmain').scrollTop = 0;
}
function openDet(i){
  var n = DB.n[i], a = accs(i);
  $('gdbox').innerHTML = '<div class="mhead"><b>'+esc(n[0])+'</b><button class="x" id="gdclose">✕</button></div>'
   + '<div class="gdin"><span class="gimg big" style="'+tileBg(i)+'"></span><div class="gdinfo"><p><b>Héroe:</b> '+esc(n[1])+'<br><b>Serie:</b> '+esc(n[2])+'</p>'
   + '<p class="gdq">Está en '+a.length+' cuenta'+(a.length===1?'':'s')+' a la venta:</p>'
   + a.map(function(num){
       return '<div class="gdacc"><b>CUENTA #'+num+'</b><button class="btn btn-gold" data-vc="'+num+'">Ver cuenta</button>'
        + '<a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/'+WA+'?text='+encodeURIComponent('Hola Johnny, me interesa la Cuenta #'+num+' que tiene la skin '+n[0]+' ('+n[1]+').')+'">WhatsApp</a></div>';
     }).join('') + '</div></div>';
  $('gdet').classList.add('show');
}
function openGal(){ build(); if(sel && !BYS[sel]) sel=''; renderList(); renderMain(); $('gal').classList.add('show'); document.body.style.overflow='hidden';
  try{ if(!(history.state && history.state.gal)) history.pushState({gal:1}, ''); }catch(e){} }
function hideGal(){ $('gal').classList.remove('show'); $('gdet').classList.remove('show'); document.body.style.overflow=''; }
function closeGal(){ if(!$('gal').classList.contains('show')) return; hideGal(); try{ if(history.state && history.state.gal) history.back(); }catch(e){} }
window.addEventListener('popstate', function(){ if(!(history.state && history.state.gal)) hideGal(); });

document.addEventListener('click', function(e){
  var t = e.target.closest('#opengal,#gclose,[data-ser],.gcard,#gdclose,[data-vc]');
  if(!t) return;
  if(t.id==='opengal') openGal();
  else if(t.id==='gclose') closeGal();
  else if(t.dataset.ser!=null){ sel = t.dataset.ser; q=''; $('gq').value=''; renderList(); renderMain(); }
  else if(t.classList.contains('gcard')) openDet(+t.dataset.sk);
  else if(t.id==='gdclose') $('gdet').classList.remove('show');
  else if(t.dataset.vc){ $('gdet').classList.remove('show'); if(window.__openCuenta) window.__openCuenta(t.dataset.vc); }
});
$('gdet').addEventListener('click', function(e){ if(e.target.id==='gdet') $('gdet').classList.remove('show'); });
$('gq').addEventListener('input', function(e){ q = e.target.value; renderMain(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if($('gdet').classList.contains('show')) $('gdet').classList.remove('show'); else if(!$('modal').classList.contains('show')) closeGal(); } });
})();
</script>
</body>
</html>
