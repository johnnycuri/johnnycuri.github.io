  if(!list.length){ $('grid').innerHTML = '<div class="empty">'+(STATE.cuentas.length?'No hay cuentas con ese filtro.':'Todavía no hay cuentas publicadas.')+'</div>'; return; }
  $('grid').innerHTML = list.map(function(x){
    var i = STATE.cuentas.indexOf(x);
    var meta = '';
    if(x.skins) meta += '<span class="chip">'+esc(x.skins)+' skins</span>';
    if(x.legend) meta += '<span class="chip">'+esc(x.legend)+' Legend</span>';
    var price = x.precio ? '<div class="price">'+esc(x.precio)+'</div>' : '<div class="price ask">Precio a consultar</div>';
    var adm = (artifact && assets) ? '<div class="admrow"><select data-st="'+i+'">'+['disponible','reservada','vendida'].map(function(s){return '<option value="'+s+'"'+(x.estado===s?' selected':'')+'>'+LABEL[s]+'</option>'}).join('')+'</select><button data-ed="'+i+'">Editar</button><button data-del="'+i+'">Eliminar</button></div>' : '';
    return '<article class="card'+(x.estado==='vendida'?' sold':'')+'"><div class="thumb" data-open="'+i+'"><img loading="lazy" src="'+esc(x.thumb||x.img)+'" alt="Cuenta #'+esc(x.num)+'"><span class="badge b-'+x.estado+'">'+LABEL[x.estado]+'</span></div>'
      + '<div class="body"><div class="num">CUENTA #'+esc(x.num)+'</div><div class="meta">'+meta+'</div>'+price
      + (x.desc ? '<p class="desc" id="d'+i+'">'+esc(x.desc)+'</p><button class="more" data-more="'+i+'">Ver más</button>' : '')
      + '<div class="actions"><button class="btn btn-gold" data-open="'+i+'">Ver catálogo</button>'
      + (x.estado!=='vendida' ? '<a class="btn btn-wa" href="'+waLink(x.num)+'" target="_blank" rel="noopener">WhatsApp</a>' : '')
      + '</div>'+adm+'</div></article>';
  }).join('');
}

function clone(){ return JSON.parse(JSON.stringify(STATE)); }
function buildDoc(st){
  var json = JSON.stringify(st).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Johnny Curi MLBB · Cuentas en venta</title>\n'

async function save(next, msg){

function makeThumb(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file); var im = new Image();
    im.onload = function(){
      var W = 720, srcH = Math.min(im.height, im.width * 0.75);
      var c = document.createElement('canvas'); c.width = W; c.height = Math.round(W * srcH / im.width);
      c.getContext('2d').drawImage(im, 0, 0, im.width, srcH, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(function(b){ b ? res(b) : rej(new Error('miniatura')); }, 'image/jpeg', 0.85);
    };
    im.onerror = function(){ rej(new Error('No se pudo leer la imagen')); };
    im.src = url;
  });
}
$('f_save').onclick = async function(){
  var num = $('f_num').value.trim().replace(/^#/,'');
  if(!num){ setStatus('Pon el número de cuenta.'); return; }
  var file = $('f_img').files[0];
  if(editing==null && !file){ setStatus('Elige la imagen del catálogo.'); return; }
  if(file && file.size > 20*1024*1024){ setStatus('La imagen pesa más de 20 MB. Usa la versión Cuenta_N.jpg (no la HD).'); return; }
  var next = clone();
  var item = editing!=null ? next.cuentas[editing] : {};
  if(editing==null){
    var dup = next.cuentas.some(function(x){return String(x.num)===num});
    if(dup){ setStatus('Ya existe la Cuenta #' + num + '. Usa Editar.'); return; }
  }
  $('f_save').disabled = true;
  try{
    if(file){
      setStatus('Subiendo imagen…');
      var up = await assets.upload(file);
      var tb = await makeThumb(file);
      var upt = await assets.upload(tb);
      item.img = up.url; item.thumb = upt.url;
    }
    item.num = num; item.skins = $('f_skins').value.trim(); item.legend = $('f_legend').value.trim();
    item.precio = $('f_precio').value.trim(); item.estado = $('f_estado').value; item.desc = $('f_desc').value.trim();
    if(editing==null){ item.fecha = new Date().toISOString().slice(0,10); next.cuentas.push(item); }
    await save(next, 'Cuenta publicada');
  }catch(err){ setStatus('Error: ' + (err && (err.message||err.code) || err)); }
  $('f_save').disabled = false;
};
function cargarVisitas(){
  try{
    fetch('https://johnnycuri.goatcounter.com/counter/TOTAL.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){
      if(d && d.count){ $('visitas').textContent = d.count; $('visbox').style.display=''; }
    }).catch(function(){});

}
window.disqus_config = function(){ this.page.url = 'https://johnnycuri.github.io/'; this.page.identifier = 'cuentas-en-venta'; this.language = 'es_ES'; };
(function(){ try{ var s=document.createElement('script'); s.src='https://johnnycuri-mlbb.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (document.head||document.body).appendChild(s); }catch(e){} })();
cargarVisitas(); setInterval(cargarVisitas, 60000);
render();
if(window.claude && claude.use){
  Promise.all([claude.use('artifact'), claude.use('assets')]).then(function(r){
    artifact = r[0]; assets = r[1];
    if(artifact && assets){ $('admin').classList.add('show'); render(); }
  }).catch(function(){});
}
})();

<script id="buscador">
(function(){
var DB = JSON.parse(document.getElementById('skinsdb').textContent);
var $ = function(id){return document.getElementById(id)};
var ROWS = Math.ceil(DB.s.length / DB.cols);
var CATN = ['Legend','Colaboraciones','Premium · Star','Eventos · Zodiac'];
var cat = -1, feats = null, loading = null, lastRes = null;

function valid(){ return window.__cuentasNums ? window.__cuentasNums() : null; }
function accs(i){
  var v = valid(), a = DB.s[i][1].split(' ');
  return v ? a.filter(function(n){return v.indexOf(n)>=0}) : a;
}
function tileStyle(i){
  var c = i % DB.cols, r = Math.floor(i / DB.cols);
  return 'background-image:url('+DB.sprite+'?v='+DB.v+');background-size:'+(DB.cols*100)+'% auto;background-position:'+(DB.cols>1?c/(DB.cols-1)*100:0)+'% '+(ROWS>1?r/(ROWS-1)*100:0)+'%';
}
function tile(i, extra){
  var n = accs(i).length;
  return '<button class="stile" data-sk="'+i+'" style="'+tileStyle(i)+'"><span class="scount">'+n+' cuenta'+(n===1?'':'s')+'</span>'+(extra||'')+'</button>';
}

var HTML = ''
 + '<div class="modal" id="smodal"><div class="sbox"><div class="mhead"><b>BUSCAR POR IMAGEN</b><button class="x" id="sclose">✕</button></div>'
 + '<div class="stabs"><button class="tab on" data-st2="up">📷 Subir captura</button><button class="tab" data-st2="gal">🖼️ Galería de skins</button></div>'
 + '<div id="p_up" class="spanel">'
 + '<label class="drop" id="drop"><input type="file" id="sfile" accept="image/*" hidden><span class="dic">📷</span><b>Toca aquí y elige la captura de la skin</b><small>Sirve una captura de tu Colección del juego, de un catálogo o de la tarjeta de la skin. Mientras más cerca esté la skin, mejor.</small></label>'
 + '<div id="sprev" class="sprev"></div><div id="sres"></div></div>'
 + '<div id="p_gal" class="spanel" style="display:none"><div class="cats" id="cats"></div><p class="shint">Toca una skin para ver qué cuentas la tienen.</p><div class="sgrid" id="sgal"></div></div>'
 + '</div></div>';
var holder = document.createElement('div'); holder.innerHTML = HTML; document.body.appendChild(holder);

// botón y aviso de filtro en la página
var bar = document.querySelector('.bar');
if(bar){
  var b = document.createElement('button'); b.className = 'btn btn-img'; b.id = 'imgsearch'; b.innerHTML = '🖼️ Buscar por imagen';
  bar.appendChild(b);
  var ban = document.createElement('div'); ban.id = 'skinban'; ban.className = 'skinban'; ban.style.display = 'none';
  bar.parentNode.insertBefore(ban, bar.nextSibling);
}

function openS(tab){ $('smodal').classList.add('show'); showTab(tab||'up'); }
function closeS(){ $('smodal').classList.remove('show'); }
function showTab(t){
  [].forEach.call(document.querySelectorAll('[data-st2]'), function(x){ x.classList.toggle('on', x.dataset.st2===t); });
  $('p_up').style.display = t==='up' ? '' : 'none';
  $('p_gal').style.display = t==='gal' ? '' : 'none';
  if(t==='gal') renderGal();
}
function renderGal(){
  var counts = [0,0,0,0], ids = [];
  DB.s.forEach(function(s,i){ if(s.length<3 && accs(i).length){ counts[s[0]]++; if(cat<0 || s[0]===cat) ids.push(i); } });
  var tot = counts.reduce(function(a,b){return a+b},0);
  $('cats').innerHTML = '<button class="tab'+(cat<0?' on':'')+'" data-cat="-1">Todas ('+tot+')</button>'
    + CATN.map(function(n,k){return '<button class="tab'+(cat===k?' on':'')+'" data-cat="'+k+'">'+n+' ('+counts[k]+')</button>'}).join('');
  $('sgal').innerHTML = ids.map(function(i){return tile(i)}).join('');
}
function pick(i){
  var nums = accs(i);
  if(window.__setSkinFilter) window.__setSkinFilter(nums);
  var n = nums.length;
  $('skinban').innerHTML = '<div class="stile mini" style="'+tileStyle(i)+'"></div><div class="sbtxt"><b>'+n+' cuenta'+(n===1?'':'s')+' con esta skin</b><span>'+nums.map(function(x){return '#'+x}).join(' · ')+'</span></div><button class="btn btn-ghost" id="unskin">✕ Quitar</button>';
  $('skinban').style.display = '';
  closeS();
  $('skinban').scrollIntoView({behavior:'smooth', block:'start'});
}
function unpick(){ if(window.__setSkinFilter) window.__setSkinFilter(null); $('skinban').style.display = 'none'; }

document.addEventListener('click', function(e){
  var t = e.target.closest('#imgsearch,#sclose,[data-st2],[data-cat],[data-sk],#unskin');
  if(!t) return;
  if(t.id==='imgsearch') openS('up');
  else if(t.id==='sclose') closeS();
  else if(t.id==='unskin') unpick();
  else if(t.dataset.st2) showTab(t.dataset.st2);
  else if(t.dataset.cat!=null){ cat = +t.dataset.cat; renderGal(); }
  else if(t.dataset.sk!=null) pick(+t.dataset.sk);
});
$('smodal').addEventListener('click', function(e){ if(e.target.id==='smodal') closeS(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeS(); });

// ---------- comparación de imágenes ----------
var FW = 12, FH = 18;
var c1 = document.createElement('canvas'); c1.width = 48; c1.height = 72; var x1 = c1.getContext('2d', {willReadFrequently:true});
var c2 = document.createElement('canvas'); c2.width = FW; c2.height = FH; var x2 = c2.getContext('2d', {willReadFrequently:true});
x1.imageSmoothingQuality = 'high'; x2.imageSmoothingQuality = 'high';
function feat(src, sx, sy, sw, sh){
  // zona del arte de la tarjeta (sin el nombre de abajo ni el marco)
  var ax = sx + sw*0.06, ay = sy + sh*0.05, aw = sw*0.88, ah = sh*0.65;
  x1.drawImage(src, ax, ay, aw, ah, 0, 0, 48, 72);
  x2.drawImage(c1, 0, 0, 48, 72, 0, 0, FW, FH);
  var d = x2.getImageData(0, 0, FW, FH).data, n = FW*FH, g = new Float32Array(n), m = 0, s = 0, k;
  for(k=0;k<n;k++){ g[k] = 0.299*d[k*4] + 0.587*d[k*4+1] + 0.114*d[k*4+2]; m += g[k]; }
  m /= n; for(k=0;k<n;k++){ s += (g[k]-m)*(g[k]-m); } s = Math.sqrt(s/n) + 1e-3;
  for(k=0;k<n;k++) g[k] = (g[k]-m)/s;
  var col = new Float32Array(4*6*3);
  for(var by=0;by<6;by++) for(var bx=0;bx<4;bx++) for(var ch=0;ch<3;ch++){
    var t = 0; for(var yy=0;yy<3;yy++) for(var xx=0;xx<3;xx++) t += d[((by*3+yy)*FW + bx*3+xx)*4+ch];
    col[(by*4+bx)*3+ch] = t/9/255;
  }
  return {g:g, c:col};
}
function dist(a, b){
  var e = 0, k, n = a.g.length; for(k=0;k<n;k++){ var q = a.g[k]-b.g[k]; e += q*q; }
  var f = 0, m = a.c.length; for(k=0;k<m;k++){ var r = a.c[k]-b.c[k]; f += r*r; }
  return e/n + 3*f/m;
}
function loadFeats(){
  if(loading) return loading;
  loading = new Promise(function(res, rej){
    var im = new Image();
    im.onload = function(){
      var tw = im.naturalWidth / DB.cols, th = im.naturalHeight / ROWS;
      feats = DB.s.map(function(s, i){ return feat(im, (i%DB.cols)*tw, Math.floor(i/DB.cols)*th, tw, th); });
      res(feats);
    };
    im.onerror = function(){ loading = null; rej(new Error('No se pudo cargar la galería de skins')); };
    im.src = DB.sprite + '?v=' + DB.v;
  });
  return loading;
}
function windows(W, H){
  var out = [[0,0,W,H]], R = DB.th / DB.tw;
  // la imagen entera como si fuera solo el arte
  var aw = Math.min(W, H*0.88/0.65/R), ah = aw*R*0.65/0.88;
  out.push([(W-aw)/2 - aw*0.06/0.88, (H-ah)/2 - ah*0.05/0.65, aw/0.88, ah/0.65]);
  var base = Math.min(W, H/R);
  [1, 0.8, 0.62, 0.48, 0.37, 0.28, 0.21].forEach(function(sc){
    var w = base*sc, h = w*R, st = Math.max(4, w*0.17);
    for(var y=0; y+h<=H+1; y+=st) for(var x=0; x+w<=W+1; x+=st) out.push([x,y,w,h]);
  });
  return out;
}
function search(file){
  $('sres').innerHTML = '<p class="shint">⏳ Buscando…</p>';
  var url = URL.createObjectURL(file), im = new Image();
  im.onload = function(){
    var sc = Math.min(1, 900/Math.max(im.width, im.height));
    var cv = document.createElement('canvas'); cv.width = Math.round(im.width*sc); cv.height = Math.round(im.height*sc);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    $('sprev').innerHTML = '<img src="'+url+'" alt="tu captura"><button class="btn btn-ghost" id="sagain">Elegir otra imagen</button>';
    $('sagain').onclick = function(){ $('sfile').click(); };
    loadFeats().then(function(F){
      setTimeout(function(){
        var ws = windows(cv.width, cv.height), best = new Float32Array(F.length).fill(99);
        ws.forEach(function(w){
          var q = feat(cv, w[0], w[1], w[2], w[3]);
          for(var i=0;i<F.length;i++){ var d = dist(q, F[i]), j = DB.s[i].length>2 ? DB.s[i][2] : i; if(d < best[j]) best[j] = d; }
        });
        var idx = []; for(var i=0;i<F.length;i++) if(DB.s[i].length<3 && accs(i).length) idx.push(i);
        idx.sort(function(a,b){return best[a]-best[b]});
        var top = idx.slice(0, 12);
        var head = best[top[0]] < 0.75 ? '<p class="shint ok">✅ Encontré esta skin. Tócala para ver las cuentas que la tienen.</p>'
                 : '<p class="shint">No encontré una igualita. Estas son las más parecidas; si no está, búscala en la <a href="#" id="togal">Galería de skins</a>.</p>';
        $('sres').innerHTML = head + '<div class="sgrid">' + top.map(function(i, k){
          return tile(i, (k===0 && best[i] < 0.75) ? '<span class="sbest">★ Más parecida</span>' : '');
        }).join('') + '</div>';
        var tg = $('togal'); if(tg) tg.onclick = function(e){ e.preventDefault(); showTab('gal'); };
      }, 30);
    }).catch(function(err){ $('sres').innerHTML = '<p class="shint">'+err.message+'</p>'; });
  };
  im.onerror = function(){ $('sres').innerHTML = '<p class="shint">No se pudo leer esa imagen. Prueba con una captura en JPG o PNG.</p>'; };
  im.src = url;
}
$('sfile').addEventListener('change', function(e){ var f = e.target.files[0]; if(f) search(f); e.target.value = ''; });
var drop = $('drop');
['dragover','dragenter'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); }); });
['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function(e){ var f = e.dataTransfer.files[0]; if(f) search(f); });
window.addEventListener('paste', function(e){
  if(!$('smodal').classList.contains('show')) return;
  var it = [].slice.call((e.clipboardData||{}).items||[]).filter(function(x){return x.type.indexOf('image')===0})[0];
  if(it){ showTab('up'); search(it.getAsFile()); }
});
})();
</script>
