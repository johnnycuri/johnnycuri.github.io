<script id="app">
(function(){
var STATE = JSON.parse(document.getElementById('state').textContent || '{"cuentas":[]}');
if(!STATE.cuentas) STATE.cuentas = [];
if(window.CUENTAS && window.CUENTAS.length) STATE.cuentas = window.CUENTAS.map(function(c){c.num=String(c.num);c.estado=String(c.estado||'disponible').toLowerCase();return c;});
var APP_SRC = document.getElementById('app').textContent;

var WA = '51931771312';
var SKELETON = ''
 + '<header><div class="wrap"><div class="brand">JOHNNY CURI MLBB</div>'
 + '<div class="sub">CUENTAS EN VENTA</div>'
 + '<div class="contact">Compra · Venta · Alquiler &nbsp;|&nbsp; WhatsApp <a href="https://wa.me/' + WA + '">+51 931 771 312</a> &nbsp;|&nbsp; YouTube <a href="https://www.youtube.com/@mobasunMLBB">@mobasunMLBB</a></div></div></header>'

 + '</div><div class="frow"><button class="btn btn-gold" id="f_save">Publicar cuenta</button><button class="btn btn-ghost" id="f_cancel" style="display:none">Cancelar edición</button><span class="status" id="f_status"></span></div></section>'
 + '<div class="bar"><div class="tabs" id="tabs"></div><input class="search" id="q" placeholder="Buscar skin o héroe (ej. Gojo, Kagura, Legend)"></div>'
 + '<div class="grid" id="grid"></div></main>'
 + '<footer>Johnny Curi MLBB · Compra · Venta · Alquiler · WhatsApp +51 931 771 312</footer>'
 + '<div class="modal" id="modal"><div class="mbox"><div class="mhead"><b id="mtitle"></b><div style="display:flex;gap:8px"><a class="btn btn-wa" id="mwa" style="padding:8px 14px">WhatsApp</a><button class="x" id="mclose">✕</button></div></div><img id="mimg" alt=""></div></div>'
 + '<div class="modal" id="confirm"><div class="dlg"><p id="ctext" style="margin:0 0 16px"></p><div class="actions"><button class="btn btn-ghost" id="cno">Cancelar</button><button class="btn btn-red" id="cyes">Eliminar</button></div></div></div>';
var root = document.createElement('div'); root.innerHTML = SKELETON; document.body.appendChild(root);
var $ = function(id){return document.getElementById(id)};
var filter = 'disponible', query = '', artifact = null, assets = null, editing = null;
var LABEL = {disponible:'DISPONIBLE', reservada:'RESERVADA', vendida:'VENDIDA'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function waLink(n){return 'https://wa.me/' + WA + '?text=' + encodeURIComponent('Hola Johnny, me interesa la Cuenta #' + n + ' que vi en tu página.')}
function sorted(){

}
function renderTabs(){
  var c = {todas:STATE.cuentas.length, disponible:0, reservada:0, vendida:0};
  STATE.cuentas.forEach(function(x){c[x.estado]++});
  var t = [['disponible','Disponibles'],['reservada','Reservadas'],['vendida','Vendidas'],['todas','Todas']];

}
function render(){
  renderTabs();
  var q = query.trim().toLowerCase();
  var list = sorted().filter(function(x){
    if(filter!=='todas' && x.estado!==filter) return false;
    if(!q) return true;
    return (('cuenta #'+x.num+' '+(x.desc||'')).toLowerCase().indexOf(q) >= 0);
  });
  if(!list.length){ $('grid').innerHTML = '<div class="empty">'+(STATE.cuentas.length?'No hay cuentas con ese filtro.':'Todavía no hay cuentas publicadas.')+'</div>'; return; }
  $('grid').innerHTML = list.map(function(x){

  else if(t.dataset.ed!=null) startEdit(+t.dataset.ed);
  else if(t.dataset.del!=null) askDelete(+t.dataset.del);
});

  }
});

function clone(){ return JSON.parse(JSON.stringify(STATE)); }
function buildDoc(st){
  var json = JSON.stringify(st).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Johnny Curi MLBB · Cuentas en venta</title>\n'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;800&display=swap">\n'
    + '<style id="css">' + CSS_SRC + '</style>\n</head>\n<body>\n'
    + '<script id="state" type="application/json">' + json + '<' + '/script>\n'
    + '<script id="app">' + APP_SRC + '<' + '/script>\n</body>\n</html>\n';
}
function setStatus(s){ $('f_status').textContent = s; }
async function save(next, msg){
  if(!artifact) return;
  setStatus('Guardando…');
  try { await artifact.publish(buildDoc(next)); setStatus(msg || 'Guardado'); }
  catch(err){ setStatus(err && /conflict/i.test(String(err.code||err.message||err)) ? 'Otra pestaña guardó antes; se recargó la página.' : 'No se pudo guardar: ' + (err && (err.message||err.code) || err)); }
}

$('cyes').onclick = function(){ $('confirm').classList.remove('show'); var next = clone(); next.cuentas.splice(pendingDel,1); save(next,'Cuenta eliminada'); };

function makeThumb(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file); var im = new Image();
    im.onload = function(){
      var W = 720, srcH = Math.min(im.height, im.width * 0.75);
      var c = document.createElement('canvas'); c.width = W; c.height = Math.round(W * srcH / im.width);
      c.getContext('2d').drawImage(im, 0, 0, im.width, srcH, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(function(b){ b ? res(b) : rej(new Error('miniatura')); }, 'image/jpeg', 0.85);
    };
    im.onerror = function(){ rej(new Error('No se pudo leer la imagen')); };
    im.src = url;
  });
}
$('f_save').onclick = async function(){
  var num = $('f_num').value.trim().replace(/^#/,'');

    var dup = next.cuentas.some(function(x){return String(x.num)===num});

      var upt = await assets.upload(tb);
      item.img = up.url; item.thumb = upt.url;
    }
    item.num = num; item.skins = $('f_skins').value.trim(); item.legend = $('f_legend').value.trim();
    item.precio = $('f_precio').value.trim(); item.estado = $('f_estado').value; item.desc = $('f_desc').value.trim();
    if(editing==null){ item.fecha = new Date().toISOString().slice(0,10); next.cuentas.push(item); }
    await save(next, 'Cuenta publicada');
  }catch(err){ setStatus('Error: ' + (err && (err.message||err.code) || err)); }
  $('f_save').disabled = false;
};
render();
if(window.claude && claude.use){
  Promise.all([claude.use('artifact'), claude.use('assets')]).then(function(r){
    artifact = r[0]; assets = r[1];
    if(artifact && assets){ $('admin').classList.add('show'); render(); }
  }).catch(function(){});
}
})();
</script>
</body>
</html>
